name: Munka Mac beta
on:
  workflow_dispatch:
  push:
    branches: ['codex/mac-mobile-beta-*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node scripts/prepare-assets.cjs
      - run: node scripts/prepare-calendar.cjs
      - run: node scripts/build-mac-overlay.cjs ${{ matrix.arch }}
      - run: node --test tests/platform-beta.test.mjs tests/mac-overlay-controller.test.mjs tests/overlay-policy.test.mjs tests/widget-bounds.test.mjs tests/widget-model.test.mjs tests/browser-bridge.test.mjs tests/cloud-sync.test.mjs
      - run: node scripts/test-native.cjs tests/mac-beta-native.cjs
      - run: node scripts/test-native.cjs tests/mac-overlay-native.cjs
      - run: pnpm pack:mac ${{ matrix.arch }}
      - run: node scripts/test-packaged-mac.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Munka-mac-beta-${{ matrix.arch }}
          path: |
            outputs/mac-beta-*/*.zip
            outputs/mac-beta-*/*.dmg
            outputs/mac-beta-*/build-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Munka-mac-overlay-evidence-${{ matrix.arch }}
          path: |
            outputs/mac-native-*/**
            outputs/mac-overlay-*/**
            outputs/mac-packaged-*/**
          if-no-files-found: warn
          retention-days: 14
